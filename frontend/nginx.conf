server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos con hash en el nombre (JS/CSS de CRA): cache agresivo, nunca cambian
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html: NUNCA cachear — así el navegador siempre carga el bundle más reciente
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
